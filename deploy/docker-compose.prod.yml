# Production stack for one VPS: PostgreSQL 18, API, background worker, and Caddy serving the SPA over HTTPS.
# Usage from the repository root:
#   cp deploy/.env.production.example deploy/.env.production   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
name: projects-hq

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://hq:${POSTGRES_PASSWORD}@postgres:5432/projects_hq?schema=public
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGINS: https://${HQ_DOMAIN}
  COOKIE_SECURE: "true"
  APP_URL: https://${HQ_DOMAIN}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS:-300}
  HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-10000}
  HEALTH_HISTORY_RETENTION_DAYS: ${HEALTH_HISTORY_RETENTION_DAYS:-30}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_SYNC_INTERVAL_SECONDS: ${GITHUB_SYNC_INTERVAL_SECONDS:-3600}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  DAILY_DIGEST_HOUR_UTC: ${DAILY_DIGEST_HOUR_UTC:-6}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projects_hq
      POSTGRES_USER: hq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq -d projects_hq"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["bun", "run", "prisma:deploy"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["bun", "run", "start:worker"]
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: https://${HQ_DOMAIN}
    restart: unless-stopped
    environment:
      HQ_DOMAIN: ${HQ_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
